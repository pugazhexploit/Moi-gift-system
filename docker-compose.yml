version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: giftledger-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: giftledger
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: giftledger-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=giftledger
      - JWT_SECRET=production_super_secret_jwt_key_at_least_32_chars!
      - JWT_REFRESH_SECRET=production_super_secret_refresh_key_at_least_32_chars!
      - CORS_ORIGINS=http://localhost:3000
      - ENVIRONMENT=production
      - COOKIE_SECURE=false
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: giftledger-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  mongo_data:
